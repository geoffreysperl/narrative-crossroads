title: Narrative Crossroads
description: Character Analysis through Roleplaying for Literary and Historical Study

remote_theme: just-the-docs/just-the-docs

url: https://narrativecrossroads.org

# Color scheme: light, dark, or custom
color_scheme: custom

# Aux links (top right)
aux_links:
  "GitHub":
    - "https://github.com/geoffreysperl/narrative-crossroads"
  "Download Framework":
    - "/downloads/Narrative_Crossroads_Framework.pdf"

aux_links_new_tab: true

# Footer
footer_content: "Created by Geoffrey Sperl. Licensed under <a href=\"https://creativecommons.org/licenses/by/4.0/\">CC BY 4.0</a>."

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

# Navigation structure
nav_enabled: true
nav_sort: case_insensitive

# Heading anchor links
heading_anchors: true

# External links open in new tab
external_links:
  enabled: true
  
# Exclude from build
exclude:
  - README.md
  - LICENSE.md
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
